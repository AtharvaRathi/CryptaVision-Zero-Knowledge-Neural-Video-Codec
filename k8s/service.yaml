apiVersion: v1
kind: Service
metadata:
  name: cryptavision-service
  namespace: default
  labels:
    app.kubernetes.io/name: cryptavision
    app.kubernetes.io/component: service
spec:
  # ClusterIP for internal cluster traffic; switch to LoadBalancer for external cloud egress
  type: ClusterIP
  selector:
    app: cryptavision
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
