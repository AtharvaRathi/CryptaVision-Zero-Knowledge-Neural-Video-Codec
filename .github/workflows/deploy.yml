name: CryptaVision CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ── JOB 1: Test Suite (AI Engine, CKKS Cryptography, FastAPI) ───────────────
  test:
    name: Run Unit & Cryptographic Test Suite
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System GStreamer & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            python3-gi \
            gir1.2-gstreamer-1.0 \
            libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-api.txt
          pip install -r requirements-crypto.txt
          pip install -r requirements-ai.txt
          pip install pytest pytest-asyncio

      - name: Execute Tests (AI Engine, TenSEAL CKKS, Vault, FastAPI)
        run: |
          pytest tests/test_ai_engine.py tests/test_crypto.py tests/test_api.py -v --tb=short

  # ── JOB 2: Multi-Stage CUDA Docker Build & Push to GHCR ───────────────────────
  build-and-push:
    name: Build & Push CUDA Container to GHCR
    needs: test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and Push Multi-Stage CUDA Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Aggressive Layer Caching via GitHub Actions Cache API
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 3: Helm Chart Validation & Linting ──────────────────────────────────
  helm-lint:
    name: Validate Helm Templates
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint Helm Chart
        run: |
          helm lint helm/cryptavision

      - name: Render Helm Template Dry-Run
        run: |
          helm template cryptavision-release helm/cryptavision --debug
